name: SkyFlow Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SkyFlow/SkyFlow.csproj

      - name: Build SkyFlow
        run: dotnet build SkyFlow/SkyFlow.csproj --configuration Release --no-restore